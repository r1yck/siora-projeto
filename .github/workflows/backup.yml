name: Backup Diario do Banco de Dados Neon

on:
  schedule:
    # Roda todos os dias às 03:00 da manhã (horário de Brasília)
    - cron: '0 6 * * *'
  workflow_dispatch: 

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar PostgreSQL Client 18
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo apt-key add -
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18

      - name: Realizar Dump do Banco Neon
        env:
          DB_URL: ${{ secrets.DATABASE_URL }}
        run: /usr/lib/postgresql/18/bin/pg_dump "$DB_URL" > "backup_$(date +%Y-%m-%d).sql"

      - name: Salvar Backup como Artefato no GitHub
        uses: actions/upload-artifact@v4
        with:
          name: backup-db-${{ github.run_id }}
          path: backup_*.sql
          retention-days: 30