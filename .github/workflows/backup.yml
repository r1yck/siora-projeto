name: Backup Diario do Banco de Dados Neon

on:
  schedule:
    # Roda todos os dias às 03:00 da manhã (horário de Brasília)
    - cron: '0 6 * * *'
  workflow_dispatch: 

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar PostgreSQL Client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Realizar Dump do Banco Neon
        env:
          DB_URL: ${{ secrets.DATABASE_URL }}
        run: |
          pg_dump "$DB_URL" > "backup_$(date +%Y-%m-%d).sql"

      - name: Salvar Backup como Artefato no GitHub
        uses: actions/upload-artifact@v4
        with:
          name: backup-db-${{ github.run_id }}
          path: backup_*.sql
          retention-days: 30